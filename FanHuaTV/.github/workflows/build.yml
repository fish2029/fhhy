# 云端打包（GitHub Actions）：本地内存不足或想开 R8 出更小的包时使用。
#
# 用法：仓库页 Actions → Build FanHuaTV → Run workflow，选变体：
#   - debug   ：assembleDebug，最快，等价于桌面上的「修复版」包（未混淆）。
#   - release ：assembleRelease 且 disableR8=false → 开启 R8 代码/资源压缩，包体明显更小。
#                注意：本项目 release 未单独配置签名，AGP 会使用默认 debug 签名，
#                与本地调试包同签名，可直接覆盖安装测试。
#
# 为什么放云端：本机 8GB 内存跑 Gradle 容易 OOM（daemon 崩溃），runner 环境干净、
# 内存充裕，且可给 Gradle 更大的堆（下面 -Xmx2g）。
name: Build FanHuaTV

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        type: choice
        options:
          - debug
          - release
        default: 'debug'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build APK
        run: |
          chmod +x gradlew
          JVMARGS="-Xmx2g -Xms64m -XX:+UseSerialGC -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=96m"
          if [ "${{ github.event.inputs.variant }}" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon -PdisableR8=false "-Dorg.gradle.jvmargs=${JVMARGS}"
          else
            ./gradlew :app:assembleDebug --no-daemon "-Dorg.gradle.jvmargs=${JVMARGS}"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fanhuatv-${{ github.event.inputs.variant }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
